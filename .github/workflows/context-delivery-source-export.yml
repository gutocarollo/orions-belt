name: Context Delivery source export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive source tree
        run: |
          git archive --format=tar.gz --output=orions-belt-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: orions-belt-source
          path: orions-belt-source.tar.gz
          if-no-files-found: error
          retention-days: 1
