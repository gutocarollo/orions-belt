name: pr16-release-check

on:
  push:
    branches:
      - tmp/pr16-release-check

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run Orion release check
        run: python3 engine/release_check.py --output /tmp/orions-release-report.json
      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-release-report
          path: /tmp/orions-release-report.json
          if-no-files-found: ignore
