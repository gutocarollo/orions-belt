name: pr16-release-check

on:
  pull_request:
    branches:
      - tmp/pr16-quality-fixes

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        run: |
          git clone --depth 1 --branch tmp/pr16-quality-fixes https://github.com/gutocarollo/orions-belt.git repo
      - name: Install uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run focused proportional Council integration tests
        working-directory: repo
        run: python3 -m unittest discover -s engine/integration/tests -v
      - name: Run Orion release check
        working-directory: repo
        run: python3 engine/release_check.py
