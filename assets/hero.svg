<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Orion's Belt — the discipline harness for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#7aa2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#9db8ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- faint starfield -->
  <g fill="#9fb3d9">
    <circle cx="120" cy="60" r="1.1" opacity="0.5"/><circle cx="240" cy="120" r="0.9" opacity="0.35"/>
    <circle cx="70" cy="200" r="1.3" opacity="0.45"/><circle cx="330" cy="250" r="0.8" opacity="0.3"/>
    <circle cx="500" cy="80" r="1" opacity="0.4"/><circle cx="880" cy="70" r="1.2" opacity="0.5"/>
    <circle cx="1040" cy="120" r="0.9" opacity="0.35"/><circle cx="1180" cy="80" r="1.1" opacity="0.45"/>
    <circle cx="1220" cy="220" r="0.8" opacity="0.3"/><circle cx="960" cy="270" r="1" opacity="0.4"/>
    <circle cx="1120" cy="290" r="0.9" opacity="0.33"/><circle cx="620" cy="300" r="0.8" opacity="0.3"/>
    <circle cx="430" cy="40" r="0.8" opacity="0.3"/><circle cx="760" cy="300" r="0.9" opacity="0.35"/>
  </g>

  <!-- Orion's Belt: three stars on a gentle diagonal, connected -->
  <g transform="translate(196,140)">
    <line x1="0" y1="60" x2="620" y2="-20" stroke="#5f7bdd" stroke-width="1.5" opacity="0.35" stroke-dasharray="2 7" stroke-linecap="round"/>
    <!-- Mintaka -->
    <g transform="translate(0,60)">
      <circle r="34" fill="url(#glow)"><animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="6.5" fill="#ffffff"/>
    </g>
    <!-- Alnilam (center, brightest) -->
    <g transform="translate(310,20)">
      <circle r="46" fill="url(#glow)"><animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle r="8.5" fill="#ffffff"/>
    </g>
    <!-- Alnitak -->
    <g transform="translate(620,-20)">
      <circle r="34" fill="url(#glow)"><animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle r="6.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="640" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="6" fill="url(#wm)">ORION'S BELT</text>
  <text x="640" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="1.5" fill="#9fb3d9">The discipline harness that keeps AI coding agents aligned, verifiable &amp; anti-drift</text>
</svg>
